name: Validate source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Ephemeral, read-only Actions token avoids shared-runner API rate limits.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check media dependencies
        timeout-minutes: 5
        run: |
          missing=()
          for tool in ffmpeg ffprobe python3; do
            if ! command -v "$tool" >/dev/null; then
              missing+=("$tool")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required runner tools: %s\n' "${missing[*]}"
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg python3
          fi
          ffmpeg -version
          ffprobe -version
          python3 --version
      - run: npm ci
        env:
          YOUTUBE_DL_SKIP_PYTHON_CHECK: '1'
      - run: npm run check:release
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run typecheck
